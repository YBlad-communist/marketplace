map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Аудит п.36: лимит запросов на авторизацию с одного IP
# (вход/регистрация/SMS-коды — основная брутфорс-цель).
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/s;

# ---------------------------------------------------------------
# HTTP → HTTPS (аудит п.36): весь трафик на 443.
# Сертификаты: certbot (--nginx) положит их в /etc/letsencrypt/live/...,
# при другом расположении замените ssl_certificate/ssl_certificate_key.
# ---------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name rinokru.com www.rinokru.com api.rinokru.com;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name s3.rinokru.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rinokru.com www.rinokru.com api.rinokru.com;

    ssl_certificate     /etc/letsencrypt/live/rinokru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinokru.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Аудит п.36: тело запроса под API ограничено 1m (JSON/presign ≤ 256kb
    # на стороне Express; большие файлы уходят presigned-URL'ом в S3 мимо API).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Аудит п.36: $remote_addr, а не $proxy_add_x_forwarded_for —
        # перед nginx нет другого прокси, клиент не может подделать XFF,
        # Express (trust proxy=1) получает реальный IP для rate limit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Аудит п.36: авторизация под rate limit.
    location /api/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Аудит п.36: загрузка в S3 через presigned PUT — до 6m
    # (S3_MAX_IMAGE_BYTES = 5m + запас на multipart/подпись).
    location /s3/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 6m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s3.rinokru.com;

    ssl_certificate     /etc/letsencrypt/live/rinokru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rinokru.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Аудит п.36: presigned-загрузки фото (лимит 5m) — 6m с запасом.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
